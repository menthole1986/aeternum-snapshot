<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aeternum Longevity Snapshot</title>
<meta name="theme-color" content="#19191B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ground:#19191B; --ink:#F4F4F6; --muted:rgba(244,244,246,.62); --dim:rgba(244,244,246,.40);
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.24);
  --grad:linear-gradient(90deg,#7A3E9E,#2F86CC);
  --grad-text:linear-gradient(90deg,#A27AD2,#4FA3E0);
  --good:#5ED3A0; --ok:#B5D333; --warn:#F2B45A; --crit:#EE7A6D;
  --gut:clamp(20px,calc(7.3*var(--u)),calc(140px*var(--k)));
  /* škálování: --u = 1vw, ale na nízkých/širokých displejích (nebo při zoomu) ho omezí výška (16:9);
     --k zvedá stropy velikostí na velkých obrazovkách (1440p, 4K, TV) */
  --u:min(1vw,1.7778vh); --k:1;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (min-width:2200px) and (min-height:1200px){:root{--k:1.35}}
@media (min-width:3000px) and (min-height:1650px){:root{--k:2}}
@media (max-width:760px){:root{--u:1vw}}
html{-webkit-text-size-adjust:100%}
/* dvojklepnutí na telefonu stránku nezvětší; roztažení dvěma prsty funguje dál */
body{touch-action:manipulation}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font)}
body{min-height:100dvh;line-height:1.5}
button,input{font:inherit;color:inherit}
p{margin:0}
:focus-visible{outline:2px solid #4FA3E0;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--ground)}
.bg svg.wave{position:absolute;inset:0;width:100%;height:100%}
.glow{position:absolute;border-radius:50%;filter:blur(40px)}
@media (max-width:760px){.bg .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,25,27,.92) 0%,rgba(25,25,27,.7) 55%,rgba(25,25,27,.15) 100%)}}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:clamp(18px,calc(3.1*var(--u)),calc(58px*var(--k))) var(--gut) 0}
main{flex:1;display:flex;align-items:center;padding:clamp(28px,calc(3.2*var(--u)),calc(60px*var(--k))) var(--gut)}
main > .screen{width:100%}
.foot{padding:0 var(--gut) clamp(20px,calc(3.6*var(--u)),calc(70px*var(--k)));display:flex;flex-direction:column;gap:clamp(20px,calc(2.4*var(--u)),calc(44px*var(--k)))}
.foot:empty{display:none}
.screen{animation:rise .4s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

/* logo */
.logo{display:flex;align-items:center;gap:clamp(12px,calc(1.15*var(--u)),calc(22px*var(--k)));text-decoration:none;color:inherit}
.logo svg{width:clamp(46px,calc(3.45*var(--u)),calc(66px*var(--k)));height:clamp(46px,calc(3.45*var(--u)),calc(66px*var(--k)));fill:none;stroke:#6B3A96;stroke-width:6.5;flex:none}
.logo .wm{display:flex;flex-direction:column;gap:4px}
.logo .wm b{font-size:clamp(21px,calc(1.62*var(--u)),calc(31px*var(--k)));font-weight:600;letter-spacing:.035em;line-height:1;background:linear-gradient(90deg,#6E3D9C,#2F7FC4);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .wm span{font-size:clamp(9px,calc(.68*var(--u)),calc(13px*var(--k)));letter-spacing:.44em;color:#6B4A9A;font-weight:500;line-height:1}
.logo.big svg{width:clamp(62px,calc(6.15*var(--u)),calc(118px*var(--k)));height:clamp(62px,calc(6.15*var(--u)),calc(118px*var(--k)))}
.logo.big .wm{gap:6px}
.logo.big .wm b{font-size:clamp(28px,calc(2.8*var(--u)),calc(54px*var(--k)))}
.logo.big .wm span{font-size:clamp(12px,calc(1.25*var(--u)),calc(24px*var(--k)))}

.contacts{display:flex;gap:clamp(18px,calc(2.3*var(--u)),calc(44px*var(--k)))}
.contacts a{display:block;width:clamp(30px,calc(2.2*var(--u)),calc(42px*var(--k)));height:clamp(30px,calc(2.2*var(--u)),calc(42px*var(--k)))}
.contacts svg{width:100%;height:100%}

.prog{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.prog .lbl{font-size:clamp(11px,calc(.8*var(--u)),calc(15px*var(--k)));letter-spacing:.32em;font-weight:600;color:var(--dim);white-space:nowrap}
.prog .lbl b{color:var(--ink);font-weight:600}
.segs{display:flex;gap:7px}
.segs i{width:clamp(16px,calc(2*var(--u)),calc(38px*var(--k)));height:3px;border-radius:2px;background:rgba(255,255,255,.16)}
.segs i.on{background:#5462B6}
.top-actions{display:flex;align-items:center;gap:14px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--dim);font-size:clamp(11px,calc(.75*var(--u)),calc(13px*var(--k)));letter-spacing:.26em;font-weight:600;cursor:pointer;text-transform:uppercase}
.linkbtn:hover{color:var(--ink)}
@media (max-width:760px){.prog .lbl{display:none}}

/* type */
.eyebrow{display:inline-block;font-size:clamp(11px,calc(.85*var(--u)),calc(16px*var(--k)));font-weight:600;letter-spacing:.34em;text-transform:uppercase;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{display:block;width:clamp(64px,calc(5.2*var(--u)),calc(100px*var(--k)));height:4px;background:var(--grad)}
.h-hero{margin:0;font-size:clamp(40px,calc(5*var(--u)),calc(96px*var(--k)));font-weight:700;line-height:1.02;letter-spacing:-.012em;text-wrap:balance}
.light{font-weight:400;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.h-xl{margin:clamp(10px,calc(1*var(--u)),calc(18px*var(--k))) 0 0;font-size:clamp(38px,calc(5.2*var(--u)),calc(104px*var(--k)));font-weight:700;line-height:1;letter-spacing:-.02em}
.h-l{margin:clamp(10px,calc(1*var(--u)),calc(18px*var(--k))) 0 0;font-size:clamp(32px,calc(3.75*var(--u)),calc(72px*var(--k)));font-weight:700;line-height:1.06;letter-spacing:-.012em}
.body-wide{font-size:clamp(16px,calc(1.35*var(--u)),calc(26px*var(--k)));font-weight:500;letter-spacing:.14em;line-height:1.62;color:rgba(244,244,246,.92);max-width:31em}
.lead{font-size:clamp(15px,calc(1.15*var(--u)),calc(22px*var(--k)));font-weight:500;letter-spacing:.04em;line-height:1.62;color:var(--muted);max-width:30em}
.small-caps{font-size:clamp(11px,calc(.8*var(--u)),calc(15px*var(--k)));letter-spacing:.3em;font-weight:600;color:var(--dim);text-transform:uppercase}
@media (max-width:760px){.body-wide{letter-spacing:.05em}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:clamp(54px,calc(3.45*var(--u)),calc(66px*var(--k)));padding:0 clamp(26px,calc(2.4*var(--u)),calc(46px*var(--k)));border-radius:999px;border:0;font-size:clamp(13px,calc(.9*var(--u)),calc(17px*var(--k)));font-weight:700;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:filter .15s,transform .1s,opacity .15s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--grad);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.28);color:var(--ink)}
.btn.ghost:hover{border-color:rgba(255,255,255,.55)}
.btn.sm{height:clamp(44px,calc(2.7*var(--u)),calc(52px*var(--k)));padding:0 clamp(18px,calc(1.6*var(--u)),calc(30px*var(--k)));font-size:clamp(11px,calc(.73*var(--u)),calc(14px*var(--k)))}
.btn[disabled]{opacity:.38;cursor:default}
.round{width:clamp(54px,calc(3.45*var(--u)),calc(66px*var(--k)));height:clamp(54px,calc(3.45*var(--u)),calc(66px*var(--k)));border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.round:hover{border-color:rgba(255,255,255,.55)}
.round svg{width:calc(24px*var(--k));height:calc(24px*var(--k));stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.navrow{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(12px,calc(1*var(--u)),calc(20px*var(--k)))}
.nav-right{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:clamp(12px,calc(1*var(--u)),calc(20px*var(--k)));margin-left:auto}
.navrow .err{flex:1;text-align:right}
.err{font-size:clamp(13px,calc(.85*var(--u)),calc(16px*var(--k)));color:var(--crit);font-weight:600;letter-spacing:.02em}
.err:empty{display:none}
@media (max-width:760px){
  .foot.sticky{position:sticky;bottom:0;padding-top:22px;background:linear-gradient(to top,var(--ground) 72%,rgba(25,25,27,0))}
  .navrow{align-items:flex-start}
  .nav-right{flex:1 1 0;min-width:0;gap:10px}
  .nav-right .btn{flex:1 1 100%}
  .nav-right .btn.pri{order:-1}
  .nav-right .btn.ghost{height:calc(46px*var(--k));font-size:11px}
  .navrow .err{flex-basis:100%;order:-1;text-align:left}
}

/* pillar strip */
.strip{display:flex;flex-wrap:wrap;gap:clamp(12px,calc(1.15*var(--u)),calc(22px*var(--k)));font-size:clamp(12px,calc(1*var(--u)),calc(19px*var(--k)));font-weight:500;letter-spacing:.34em;color:rgba(244,244,246,.34);white-space:nowrap}
.strip b{font-weight:600;color:var(--ink)}
.strip.all{color:var(--ink)}
@media (max-width:1100px){.strip.qs{display:none}}
@media (max-width:760px){.strip{font-size:11px;letter-spacing:.22em;gap:8px 10px}}

/* split layout */
.split{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1fr);gap:clamp(36px,calc(6.5*var(--u)),calc(130px*var(--k)));align-items:start}
@media (max-width:1000px){.split{grid-template-columns:1fr}}

/* intro */
.intro{max-width:calc(1240px*var(--k))}
.intro .body-wide{margin-top:clamp(18px,calc(1.5*var(--u)),calc(28px*var(--k)))}
.intro .bar{margin-top:clamp(28px,calc(2.6*var(--u)),calc(50px*var(--k)))}
.intro .btn{margin-top:clamp(40px,calc(4.2*var(--u)),calc(80px*var(--k)))}

/* underline fields */
.ufrow{display:grid;gap:clamp(22px,calc(2.5*var(--u)),calc(48px*var(--k)));grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
.ufrow.four{--cols:4}
.ufrow.two{--cols:2}
.ufrow.one{--cols:1}
@media (max-width:760px){.ufrow{--cols:2!important}.ufrow.one{--cols:1!important}}
.uf{display:flex;flex-direction:column;gap:clamp(8px,calc(.75*var(--u)),calc(14px*var(--k)));min-width:0;padding-bottom:clamp(10px,calc(.95*var(--u)),calc(18px*var(--k)));border-bottom:1.5px solid var(--line2);transition:border-color .15s}
.uf:focus-within{border-color:#4FA3E0}
.uf.invalid{border-color:var(--crit)}
.uf label,.uf .lab{font-size:clamp(10px,calc(.73*var(--u)),calc(14px*var(--k)));letter-spacing:.28em;font-weight:600;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uf label em,.uf .lab em{font-style:normal;letter-spacing:.12em;text-transform:none;font-weight:500}
.uf input{width:100%;min-width:0;background:transparent;border:0;outline:none;padding:0;font-size:clamp(22px,calc(1.9*var(--u)),calc(36px*var(--k)));font-weight:400;line-height:1.15}
.uf input::placeholder{color:rgba(244,244,246,.22)}
.uf.big input{font-size:clamp(34px,calc(4.4*var(--u)),calc(84px*var(--k)));font-weight:300;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.uf.mid input{font-size:clamp(26px,calc(2.3*var(--u)),calc(44px*var(--k)));font-weight:600;font-variant-numeric:tabular-nums}
.uf input[type="date"]{color-scheme:dark}
.uf input::-webkit-outer-spin-button,.uf input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.uf input[type="number"]{-moz-appearance:textfield}
.bp{display:flex;align-items:baseline;gap:6px}
.bp input{width:3.1ch;flex:none}
.bp span{font-size:clamp(34px,calc(4.4*var(--u)),calc(84px*var(--k)));font-weight:200;color:var(--dim);line-height:1}
.upload{position:relative;display:flex;align-items:center;gap:clamp(16px,calc(1.6*var(--u)),calc(30px*var(--k)));border:1.5px dashed rgba(255,255,255,.26);border-radius:clamp(20px,calc(1.5*var(--u)),calc(28px*var(--k)));padding:clamp(18px,calc(1.7*var(--u)),calc(32px*var(--k))) clamp(18px,calc(1.9*var(--u)),calc(36px*var(--k)));cursor:pointer;transition:border-color .15s,background .15s}
.upload:hover{border-color:#4FA3E0;background:rgba(47,134,204,.06)}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.upload .ic{width:clamp(52px,calc(4*var(--u)),calc(76px*var(--k)));height:clamp(52px,calc(4*var(--u)),calc(76px*var(--k)));border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none}
.upload .ic svg{width:44%;height:44%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.upload .tx{flex:1;min-width:0}
.upload .tx b{display:block;font-size:clamp(17px,calc(1.35*var(--u)),calc(26px*var(--k)));font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload .tx span{display:block;font-size:clamp(13px,calc(.95*var(--u)),calc(18px*var(--k)));color:var(--muted);margin-top:4px}
.upload .tx span.ok{color:var(--good)}
@media (max-width:760px){.upload .btn{display:none}}
.minipills{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.minipill{height:clamp(40px,calc(2.4*var(--u)),calc(46px*var(--k)));padding:0 clamp(16px,calc(1.2*var(--u)),calc(22px*var(--k)));border-radius:999px;border:1.5px solid rgba(255,255,255,.22);background:transparent;font-size:clamp(13px,calc(.85*var(--u)),calc(16px*var(--k)));font-weight:600;cursor:pointer;color:var(--muted)}
.minipill[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
.tip{font-size:clamp(13px,calc(.85*var(--u)),calc(16px*var(--k)));color:var(--dim);line-height:1.6;margin-top:clamp(14px,calc(1.2*var(--u)),calc(22px*var(--k)));max-width:36em}

/* checkbox */
.cbox{position:relative;display:flex;gap:clamp(14px,calc(1*var(--u)),calc(20px*var(--k)));align-items:flex-start;cursor:pointer;font-size:clamp(13px,calc(.8*var(--u)),calc(15px*var(--k)));line-height:1.6;color:var(--muted)}
.cbox input{position:absolute;opacity:0;width:1px;height:1px}
.cbox .box{width:calc(26px*var(--k));height:calc(26px*var(--k));border-radius:8px;border:1.5px solid rgba(255,255,255,.35);flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:background .15s,border-color .15s}
.cbox .box svg{width:calc(16px*var(--k));height:calc(16px*var(--k));stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.cbox input:checked + .box{background:var(--grad);border-color:transparent}
.cbox input:checked + .box svg{opacity:1}
.cbox input:focus-visible + .box{outline:2px solid #4FA3E0;outline-offset:3px}
.cbox em{font-style:normal;color:var(--dim)}
.consents{display:flex;flex-direction:column;gap:18px;margin-top:clamp(28px,calc(2.6*var(--u)),calc(48px*var(--k)))}

/* question */
.qcount{display:flex;align-items:center;gap:18px;margin-top:clamp(28px,calc(2.9*var(--u)),calc(56px*var(--k)))}
.qcount .segs i{width:clamp(22px,calc(2.3*var(--u)),calc(44px*var(--k)))}
.qpre{margin-bottom:clamp(12px,calc(1*var(--u)),calc(18px*var(--k)))}
.qtext{font-size:clamp(24px,calc(2.6*var(--u)),calc(50px*var(--k)));font-weight:600;line-height:1.2;letter-spacing:-.005em;text-wrap:balance}
.qtext.long{font-size:clamp(22px,calc(2.1*var(--u)),calc(40px*var(--k)))}
@media (min-width:1001px){.rows.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(24px,calc(2.3*var(--u)),calc(44px*var(--k)))}.rows.cols2 .rowopt:nth-child(2){border-top:1px solid rgba(255,255,255,.12)}}
.qhint{margin-top:14px;font-size:clamp(14px,calc(.95*var(--u)),calc(18px*var(--k)));color:var(--muted);line-height:1.55}
.opts{display:flex;flex-wrap:wrap;gap:clamp(10px,calc(.95*var(--u)),calc(18px*var(--k)));margin-top:clamp(30px,calc(3.3*var(--u)),calc(64px*var(--k)))}
.opt{height:clamp(64px,calc(5.8*var(--u)),calc(112px*var(--k)));min-width:clamp(84px,calc(9.9*var(--u)),calc(190px*var(--k)));padding:0 clamp(22px,calc(1.9*var(--u)),calc(36px*var(--k)));border-radius:999px;border:1.5px solid rgba(255,255,255,.22);background:transparent;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,calc(2*var(--u)),calc(38px*var(--k)));font-weight:600;color:rgba(244,244,246,.84);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opts.sm .opt{height:clamp(52px,calc(3.9*var(--u)),calc(74px*var(--k)));min-width:0;font-size:clamp(16px,calc(1.3*var(--u)),calc(25px*var(--k)));padding:0 clamp(18px,calc(1.5*var(--u)),calc(30px*var(--k)))}
.opt:hover{border-color:rgba(255,255,255,.5)}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 18px 50px rgba(47,134,204,.28)}
.scale-ends{display:flex;justify-content:space-between;max-width:calc(5 * clamp(84px,calc(9.9*var(--u)),calc(190px*var(--k))) + 4 * clamp(10px,calc(.95*var(--u)),calc(18px*var(--k))));margin-top:14px}
.rows{margin-top:clamp(26px,calc(2.3*var(--u)),calc(44px*var(--k)));border-bottom:1px solid rgba(255,255,255,.12)}
.rowopt{width:100%;display:flex;align-items:center;gap:clamp(16px,calc(1.45*var(--u)),calc(28px*var(--k)));min-height:clamp(58px,calc(3.9*var(--u)),calc(76px*var(--k)));padding:10px 0;border:0;border-top:1px solid rgba(255,255,255,.12);background:transparent;text-align:left;font-size:clamp(17px,calc(1.35*var(--u)),calc(26px*var(--k)));font-weight:500;color:var(--muted);cursor:pointer;transition:color .15s}
.rowopt:hover{color:var(--ink)}
.rowopt .mark{width:clamp(24px,calc(1.56*var(--u)),calc(30px*var(--k)));height:clamp(24px,calc(1.56*var(--u)),calc(30px*var(--k)));border-radius:50%;border:2px solid rgba(255,255,255,.35);flex:none;display:flex;align-items:center;justify-content:center}
.rowopt.multi .mark{border-radius:8px}
.rowopt .mark svg{width:60%;height:60%;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none}
.rowopt[aria-pressed="true"]{color:#fff;font-weight:600}
.rowopt[aria-pressed="true"] .mark{border-color:transparent;background:var(--grad)}
.rowopt:not(.multi)[aria-pressed="true"] .mark::after{content:"";width:34%;height:34%;border-radius:50%;background:#fff}
.rowopt.multi[aria-pressed="true"] .mark svg{display:block}
.autohint{margin-top:clamp(22px,calc(1.9*var(--u)),calc(36px*var(--k)))}

/* generating */
.checks{display:flex;flex-direction:column;gap:clamp(10px,calc(.75*var(--u)),calc(14px*var(--k)));margin-top:clamp(30px,calc(2.7*var(--u)),calc(52px*var(--k)));font-size:clamp(13px,calc(1*var(--u)),calc(19px*var(--k)));letter-spacing:.3em;font-weight:600}
.checks div{display:flex;align-items:center;gap:18px;color:var(--dim);transition:color .3s}

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);

function avgW(pairs) { let s = 0, w = 0; for (const [v, wt] of pairs) { if (v != null && !isNaN(v)) { s += v * wt; w += wt; } } return w ? s / w : null; }
function mix(q, obj, wq, wo) { if (obj == null) return q; if (q == null) return obj; return q * wq + obj * wo; }

/* ---------- state ---------- */
const newSid = () => (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
const blank = () => ({ cur: 'intro', sid: newSid(), a: {}, m: {}, measSkipped: false, ai: null, cta: { open: false, done: false }, startedAt: new Date().toISOString() });

function save() { if (CFG.kiosk) return; try { sessionStorage.setItem(CFG.storageKey, JSON.stringify(S)); } catch (e) {} }

function ageFromDob(dob) {
  if (!dob) return null;

  const t = new Date(); let a = t.getFullYear() - d.getFullYear();
  if (t.getMonth() < d.getMonth() || (t.getMonth() === d.getMonth() && t.getDate() < d.getDate())) a--;
  return a;
}
const age = () => ageFromDob(S.a.dob);
const hasBP = () => num(S.m.sys) != null && num(S.m.dia) != null;
const pregnant = () => S.a.H0 === 4;

/* ---------- question bank ---------- */
const o = (label, score) => ({ label, score });
const FREQ = ['nikdy', 'téměř nikdy', 'občas', 'docela často', 'velmi často'];

const Q = {

  M5: { label: 'Vyjdete 3 patra bez zastavení a bez výrazného zadýchání?', opts: [o('ano, snadno', 100), o('s námahou', 50), o('ne', 10)], w: .20,

  N1: { label: 'Kolik porcí zeleniny a ovoce sníte denně?', opts: [o('0–1', 10), o('2–3', 50), o('4–5', 85), o('6+', 100)],

  N2: { label: 'Ve kolika hlavních jídlech denně máte bílkoviny?', hint: 'Maso, ryby, vejce, luštěniny, tvaroh.', opts: [o('zřídka', 10), o('v jednom', 45), o('ve dvou', 80), o('ve všech', 100)],

  N3: { label: 'Jak často jíte sladkosti nebo fast food, případně pijete slazené nápoje?', opts: [o('denně', 10), o('několikrát týdně', 45), o('výjimečně', 100)],
        tip: 'Nahraďte jednu sladkost denně ovocem s hrstí ořechů.' },
  N4: { label: 'Kolik sklenek alkoholu vypijete za týden?', opts: [o('0', 100), o('1–3', 80), o('4–7', 40), o('8+', 10)],

  PSS1: { chips: true, pre: 'V posledním měsíci', label: 'Jak často jste měla pocit, že nemáte pod kontrolou důležité věci ve svém životě?', opts: FREQ.map((l, i) => o(l, i)) },

  R2: { label: 'Jak hodnotíte kvalitu svého spánku?', scale: ['velmi špatná', 'výborná'], opts: [o('1', 10), o('2', 30), o('3', 55), o('4', 80), o('5', 100)], w: .25,

  S3: { label: 'Vstáváte ve stejný čas (±1 hodina) i o víkendu?', opts: [o('ano', 100), o('částečně', 60), o('ne', 20)],

  S6: { label: 'Kolik hodin týdně pracujete?', opts: [o('do 40', 100), o('41–50', 65), o('přes 50', 25)],
        tip: 'Aspoň 3× týdně si stanovte pevný konec pracovního dne.' },
  H0: { label: 'Která situace vás nejlépe vystihuje?',
        opts: [o('Menstruuji pravidelně, bez hormonální antikoncepce', null), o('Menstruuji nepravidelně', null), o('Užívám hormonální antikoncepci', null),
               o('Menstruaci nemám déle než 12 měsíců', null), o('Jsem těhotná nebo kojím', null)] },
  H1: { label: 'Jak dlouhý je váš cyklus?', opts: [o('21–35 dní, předvídatelně', 0), o('Kratší než 21 dní', 2), o('Delší než 35 dní', 3), o('Nepředvídatelný, nebo méně než 8 menstruací ročně', 3)] },

  P1: { label: 'Kouříte nebo vapujete?', opts: [o('nikdy', 100), o('dříve ano', 75), o('příležitostně', 35), o('denně', 0)], w: .25,

        tip: 'Objednejte se na preventivní gynekologickou prohlídku.' },

const PERI = [
  ['PM1', 'Návaly horka nebo noční pocení'], ['PM2', 'Změna délky nebo síly menstruace za poslední rok'], ['PM3', 'Zhoršený spánek'],

];
PERI.forEach(([id, label]) => { Q[id] = { pre: 'Jak moc vás v poslední době trápí', label, opts: [o('vůbec', 0), o('mírně', 1), o('středně', 2), o('výrazně', 3)], peri: true }; });

const menstruating = () => S.a.H0 === 0 || S.a.H0 === 1;
const onHAK = () => S.a.H0 === 2;
const menopause = () => S.a.H0 === 3;
function hormonalItems() {
  const h = S.a.H0; if (h == null || h === 4) return [];
  const list = [];
  if (!menopause()) { if (menstruating()) list.push('H1'); list.push('H2', 'H3', 'H4', 'H5', 'H6'); if (onHAK()) list.push('H7'); }
  if ((age() ?? 0) >= 38 || menopause()) PERI.forEach(([id]) => { if (id === 'PM2' && !menstruating()) return; list.push(id); });
  list.push('THY');
  return list;
}

/* ==========================================================================
   AI (Apps Script → Claude API)
   ========================================================================== */
async function api(action, data, timeoutMs) {
  if (!CFG.apiUrl) throw Object.assign(new Error('no_api'), { code: 'no_api' });
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    // text/plain = bez CORS preflightu, Apps Script ho přijme
    const res = await fetch(CFG.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, session: S.sid, src: CFG.src }, data)), signal: ctrl.signal });
    const j = await res.json();
    if (!j.ok) throw Object.assign(new Error(j.error || 'api_error'), { code: j.error || 'api_error' });
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw Object.assign(new Error('timeout'), { code: 'timeout' });
    throw e;
  } finally { clearTimeout(timer); }
}

/* ---------- report z váhy ---------- */
const readB64 = blob => new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = fail; r.readAsDataURL(blob); });
async function prepareFile(file) {
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if (isPdf) {
    if (file.size > 8 * 1024 * 1024) throw Object.assign(new Error('file_too_large'), { code: 'file_too_large' });
    return { mediaType: 'application/pdf', data: await readB64(file) };
  }
  // fotky (i HEIC z iPhonu, pokud je prohlížeč umí zobrazit) převedeme na JPEG s delší stranou max. 1568 px
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = url; });
    const scale = Math.min(1, 1568 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.9));
    return { mediaType: 'image/jpeg', data: await readB64(blob) };
  } catch (e) {
    throw Object.assign(new Error('unsupported_file'), { code: 'unsupported_file' });
  } finally { URL.revokeObjectURL(url); }
}
function uploadStatusHTML() {
  const st = S.m.upload;
  if (!S.m.fileName) return '<span>PDF z aplikace nebo fotka displeje</span>';
  if (st === 'reading') return '<span>Čtu hodnoty z reportu…</span>';
  if (st === 'ok') return '<span class="ok">Hodnoty jsme načetli. Zkontrolujte je prosím.</span>';
  if (st === 'notreport') return '<span style="color:var(--warn)">Soubor nevypadá jako report z váhy. Zkuste jiný, nebo hodnoty opište.</span>';
  if (st === 'toolarge') return '<span style="color:var(--warn)">Soubor je větší než 8 MB. Zkuste snímek obrazovky, nebo hodnoty opište.</span>';
  if (st === 'error') return '<span style="color:var(--warn)">Report se nepodařilo přečíst. Hodnoty prosím opište níže.</span>';
  return '<span class="ok">Soubor nahrán. Hodnoty prosím opište níže.</span>';
}
function rerenderMeasure() { if (S.cur === 'measure') { const y = scrollY; render(); scrollTo(0, y); } else save(); }
async function handleReport(file) {
  S.m.fileName = file.name; S.m.reportWarn = [];
  if (!CFG.apiUrl) { S.m.upload = 'manual'; rerenderMeasure(); return; }
  S.m.upload = 'reading'; rerenderMeasure();
  try {
    const payload = await prepareFile(file);

    if (!r.isBodyCompositionReport) { S.m.upload = 'notreport'; rerenderMeasure(); return; }
    const put = (k, v) => { if (v != null) S.m[k] = String(v); };
    put('rWeight', r.weightKg); put('fat', r.bodyFatPct); put('visc', r.visceralFat); put('metAge', r.metabolicAge);
    if (r.muscleVsRange) S.m.muscle = { below: 0, within: 1, above: 2 }[r.muscleVsRange];
    S.m.reportHeight = r.heightCm; S.m.reportName = r.personName; S.m.reportDevice = r.deviceName; S.m.reportDate = r.measuredAt;
    S.m.reportExtra = { fatMassKg: r.fatMassKg, skeletalMuscleKg: r.skeletalMuscleKg, bmrKcal: r.bmrKcal, waterKg: r.waterKg, proteinKg: r.proteinKg, mineralsKg: r.mineralsKg, subcutaneousFatKg: r.subcutaneousFatKg, bmi: r.bmi };
    const warn = [];
    if (r.measuredAt) { const days = (Date.now() - new Date(r.measuredAt + 'T00:00:00')) / 864e5; if (days > 30) warn.push(`Měření je z ${new Date(r.measuredAt).toLocaleDateString('cs-CZ')}, tedy starší než 30 dní. Pro přesný výsledek se prosím změřte znovu.`); }
    if (r.sex === 'male') warn.push('Report je vedený pro muže. Patří opravdu vám?');
    const a = age(); if (r.age != null && a != null && Math.abs(r.age - a) > 2) warn.push(`Věk na reportu (${r.age}) nesedí s vaším datem narození. Patří report opravdu vám?`);
    S.m.reportWarn = warn; S.m.upload = 'ok';
  } catch (e) {
    S.m.upload = e.code === 'file_too_large' ? 'toolarge' : 'error';
    console.warn('[Snapshot] čtení reportu selhalo:', e.code || e.message);
  }

}

function aiInput(R) {
  const answers = [];

    const a = q.multi ? (v === 'none' ? q.none : v.map(i => q.opts[i]).join(', ')) : q.opts[v] && q.opts[v].label;
    if (a != null) answers.push({ pillar: sec, q: (q.pre ? q.pre + ': ' : '') + q.label, a });
  }));
  const m = {};
  if (hasBP()) m.bloodPressure = `${num(S.m.sys)}/${num(S.m.dia)} (${BP_LABELS[bpCat(num(S.m.sys), num(S.m.dia))][0]})`;
  else if (S.a.BPF != null) m.bloodPressureSelfReported = Q.BPF.opts[S.a.BPF].label;
  if (num(S.m.pulse) != null) m.pulse = num(S.m.pulse);
  if (!R.preg) {
    if (R.bmi != null) m.bmi = +R.bmi.toFixed(1);
    if (num(S.m.fat) != null) m.bodyFatPct = num(S.m.fat);
    if (num(S.m.visc) != null) m.visceralFat = num(S.m.visc);
    if (S.m.muscle != null && S.m.muscle < 3) m.muscleVsRange = ['below', 'within', 'above'][S.m.muscle];
    if (R.detail.prevention.metDelta != null) m.metabolicAgeDelta = R.detail.prevention.metDelta;
  }
  if (num(S.m.grip) != null) { m.gripKg = num(S.m.grip); m.gripBand = gripBand(num(S.m.grip), R.age)[0]; }
  return {
    age: R.age, index: R.index, band: BAND_LABEL[BAND(R.index)][0], confidence: R.confidence,
    scores: Object.fromEntries(ORDER.map(k => [k, R.detail[k].score])),

    measurements: m, safetyNotes: R.flags.map(f => f.text),

  };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
const aiKeyFor = R => hashStr(JSON.stringify(aiInput(R)));
function aiTexts(R) { return S.ai && S.ai.key === aiKeyFor(R) ? S.ai.texts : null; }

/* ---------- generating ---------- */
const GEN_MESSAGES = [
  'Propojujeme odpovědi s naměřenými hodnotami.',
  'Počítáme váš Longevity Index.',
  'Porovnáváme hodnoty s normami pro váš věk.',
  'Hledáme oblasti s největším dopadem.',
  'Vyhodnocujeme hormonální signály.',
  'Připravujeme první kroky na míru.',
  'Dokončujeme váš Snapshot.'
];
let genTimer = null;
function runGenerating() {
  clearInterval(genTimer);
  const rows = [...document.querySelectorAll('#checks > div')];
  const expected = CFG.apiUrl ? 15000 : 3200;     // odhad délky; skutečný konec určí dokončení textů
  const t0 = performance.now();
  let aiDone = !CFG.apiUrl, doneAt = null, shownMsg = 0, finished = false;
  const status = $('#genStatus');
  const setMsg = i => {
    if (!status || i === shownMsg) return; shownMsg = i;
    status.classList.add('fade');
    setTimeout(() => { status.textContent = GEN_MESSAGES[i]; status.classList.remove('fade'); }, 350);
  };
  // časovač místo requestAnimationFrame: běží i ve skrytém panelu nebo po přepnutí aplikace; plynulost dodá CSS přechod
  const frame = () => {
    if (S.cur !== 'generating') { clearInterval(genTimer); return; }
    const t = performance.now() - t0;
    // plynulý průběh: do odhadu 0–90 %, pak pomalu k 97 %; po dokončení textů rychle na 100 %
    let p = t < expected ? 0.9 * (1 - Math.pow(1 - t / expected, 2)) : Math.min(0.97, 0.9 + (t - expected) / 60000);
    if (aiDone && t >= 1800) { if (doneAt == null) doneAt = { t, p }; p = Math.min(1, doneAt.p + (t - doneAt.t) / 700 * (1 - doneAt.p)); }
    const step = p >= 1 ? rows.length : Math.min(rows.length - 1, Math.floor(p * rows.length));
    rows.forEach((r, j) => { r.className = j < step ? 'done' : j === step ? 'cur' : ''; });
    const arc = $('#arc'); if (arc) arc.setAttribute('stroke-dashoffset', (1482.8 * (1 - p)).toFixed(1));
    const txt = $('#ringTxt'); if (txt) txt.textContent = Math.round(p * 100) + ' %';
    const bar = $('#genBar'); if (bar) bar.style.width = (p * 100).toFixed(1) + '%';
    setMsg(Math.min(GEN_MESSAGES.length - 1, step));
    if (p >= 1 && !finished) {
      finished = true; clearInterval(genTimer);
      setTimeout(() => { if (S.cur === 'generating') { S.cur = 'result'; render(); window.scrollTo(0, 0); } }, 650);
    }
  };
  genTimer = setInterval(frame, 120);
  frame();
  if (CFG.apiUrl) {
    const R = compute(); const key = aiKeyFor(R);
    if (S.ai && S.ai.key === key) aiDone = true;
    else api('generateSnapshot', { input: aiInput(R) }, CFG.generateTimeoutMs)
      .then(j => { S.ai = { key, texts: j.texts, at: new Date().toISOString() }; })
      .catch(e => { S.ai = null; console.warn('[Snapshot] texty z AI nedorazily, použijeme šablony:', e.code || e.message); })
      .finally(() => { aiDone = true; save(); });
  }
}

const SIGNAL_LABEL = { low: ['nízký signál', 'good'], mid: ['střední signál', 'warn'], high: ['výrazný signál', 'crit'] };

/* ---------- výsledek ---------- */
function radarSVG(R, theme) {
  const light = theme === 'light';
  const keys = ORDER.filter(k => R.detail[k].score != null);
  const N = keys.length, cx = 400, cy = 400, rad = 300, id = light ? 'L' : 'D';
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const P = (i, r) => pt(i, r).map(v => v.toFixed(1)).join(',');
  const grid = light ? '25,25,27' : '255,255,255';
  let g = `<defs><linearGradient id="rf${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A3E9E" stop-opacity="${light ? .45 : .62}"/><stop offset="1" stop-color="#2F86CC" stop-opacity="${light ? .35 : .5}"/></linearGradient>
    <linearGradient id="rs${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${light ? '#6E3D9C' : '#B391E0'}"/><stop offset="1" stop-color="${light ? '#2F86CC' : '#4FA3E0'}"/></linearGradient></defs>`;
  [100, 75, 50, 25].forEach(v => { g += `<polygon points="${keys.map((_, i) => P(i, rad * v / 100)).join(' ')}" fill="none" stroke="rgba(${grid},${v === 100 ? .2 : .08})"/>`; });
  g += `<g stroke="rgba(${grid},.08)">${keys.map((_, i) => { const [x, y] = pt(i, rad); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }).join('')}</g>`;
  g += `<polygon points="${keys.map((k, i) => P(i, rad * R.detail[k].score / 100)).join(' ')}" fill="url(#rf${id})" stroke="url(#rs${id})" stroke-width="3" stroke-linejoin="round"/>`;
  g += `<g fill="${light ? '#6E3D9C' : '#fff'}">${keys.map((k, i) => { const [x, y] = pt(i, rad * R.detail[k].score / 100); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"/>`; }).join('')}</g>`;
  g += `<g font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="${light ? '#5A5E6B' : 'rgba(244,244,246,.7)'}">`;
  keys.forEach((k, i) => {
    const [x, y] = pt(i, rad + 44);
    const anchor = Math.abs(x - cx) < 10 ? 'middle' : x > cx ? 'start' : 'end';
    g += `<text x="${x.toFixed(1)}" y="${(y + 8).toFixed(1)}" text-anchor="${anchor}">${NAMES[k].toUpperCase()} <tspan fill="${light ? '#19191B' : '#fff'}" font-weight="700" font-size="24" letter-spacing="0">${R.detail[k].score}</tspan></text>`;
  });
  g += '</g>';
  return `<svg viewBox="-180 0 1160 800" role="img" aria-label="Radar sedmi složek Longevity Indexu">${g}</svg>`;
}

function validateRC(raw, dob) {
  const s = String(raw || '').replace(/[\s/]/g, '');
  if (!/^\d{9,10}$/.test(s)) return 'Rodné číslo má 9 nebo 10 číslic.';
  const yy = +s.slice(0, 2); let mm = +s.slice(2, 4); const dd = +s.slice(4, 6);
  if (s.length === 10) { const n = +s.slice(0, 9), c = +s[9]; if (!((+s % 11 === 0) || ((n % 11) === 10 && c === 0))) return 'Rodné číslo není platné. Zkontrolujte prosím překlepy.'; }
  const female = mm > 50; if (mm > 70) mm -= 70; else if (mm > 50) mm -= 50; else if (mm > 20) mm -= 20;
  const year = s.length === 9 ? 1900 + yy : (yy < 54 ? 2000 + yy : 1900 + yy);
  if (dob) { const [Y, M, D] = dob.split('-').map(Number); if (Y !== year || M !== mm || D !== dd) return 'Rodné číslo neodpovídá zadanému datu narození.'; }
  if (!female) return 'Rodné číslo neodpovídá ženskému tvaru. Zkontrolujte prosím překlepy.';
  return null;
}

let pdfCache = null;
async function buildPdf(R) {
  const key = snapshotKey(R);
  if (pdfCache && pdfCache.key === key) return pdfCache;
  await Promise.all([lib('h2c'), lib('jspdf')]);
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const host = document.createElement('div');
  host.className = 'pdf-host'; host.setAttribute('aria-hidden', 'true');
  document.body.appendChild(host);
  try {
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const pages = await pdfBuildPages(R, host);
    for (let i = 0; i < pages.length; i++) {
      // scale 3 ≈ 290 DPI (asi 1,7 MB); starší mobily s malou pamětí canvasu dostanou scale 2
      const opts = { backgroundColor: null, logging: false, useCORS: true };
      let canvas = await window.html2canvas(pages[i], Object.assign({ scale: 3 }, opts));
      let data = canvas.toDataURL('image/jpeg', 0.92);
      if (data.length < 5000) { canvas = await window.html2canvas(pages[i], Object.assign({ scale: 2 }, opts)); data = canvas.toDataURL('image/jpeg', 0.92); }
      if (i) doc.addPage();
      doc.addImage(data, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
    }
    doc.setProperties({ title: 'Aeternum Longevity Snapshot', author: 'Aeternum Clinic' });
    pdfCache = { key, blob: doc.output('blob'), b64: doc.output('datauristring').split(',')[1] };
    return pdfCache;
  } finally { host.remove(); }
}

    const p = await buildPdf(compute());
    const url = URL.createObjectURL(p.blob);
    const a = document.createElement('a');
    a.href = url; a.download = `Aeternum-Longevity-Snapshot-${(S.a.firstName || 'klientka').normalize('NFD').replace(/[^\w]/g, '')}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) {
    console.warn('[Snapshot] PDF se nepodařilo vytvořit:', e);
    alert('PDF se teď nepodařilo připravit. Zkuste to prosím znovu.');
  } finally { if (btn) { btn.disabled = false; btn.textContent = label; } }
}

/* ---------- odeslání Snapshotu (zápis + e-mail s PDF) ---------- */
let submitPromise = null;
function sendStatusHTML() {
  const st = S.send && S.send.state;
  if (!CFG.apiUrl || !st) return '<p class="send-status" id="sendStatus" hidden></p>';
  const email = `<b style="color:var(--ink)">${esc(S.a.email)}</b>`;
  const text = st === 'sending' ? `Posíláme váš Snapshot na ${email}…`
    : st === 'sent' ? `Snapshot v PDF jsme poslali na ${email}.`
    : st === 'saved' ? `Snapshot je uložený, ale e-mail se nepodařilo odeslat. Ozveme se vám.`
    : `Snapshot se nepodařilo odeslat. <button type="button" class="linkbtn" data-act="resubmit" style="padding:0">Zkusit znovu</button>`;
  return `<p class="send-status ${st === 'saved' ? 'failed' : st}" id="sendStatus" role="status"><span class="dot"></span><span>${text}</span></p>`;
}
function setSend(key, state) {
  S.send = { key, state }; save();
  const el = $('#sendStatus'); if (el) el.outerHTML = sendStatusHTML();
}
function submitPayload(R) {
  const p = buildPayload(R);
  delete p.rc; delete p.surname; delete p.phone;
  return p;
}
function emailData(R) {
  return {
    firstName: S.a.firstName, index: R.index, band: BAND_LABEL[BAND(R.index)][0], summary: summaryOf(R),
    priorities: R.priorities.map((p, i) => ({ name: NAMES[p.k], score: R.detail[p.k].score, why: prioWhy(R, i), step: pillarStep(R, p.k) }))
  };
}
// Longevity Index jako PNG s plynulým gradientem: e-mailoví klienti neumí gradient v textu.
async function indexImage(R, px = 64) {
  const S3 = 3, size = px * S3, text = String(R.index);
  const font = `300 ${size}px Montserrat, 'Helvetica Neue', Arial, sans-serif`;
  try { await document.fonts.load(`300 ${size}px Montserrat`, text); } catch (e) {}
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  ctx.font = font;
  const m = ctx.measureText(text);
  const asc = Math.ceil(m.actualBoundingBoxAscent || size * .72), desc = Math.ceil(m.actualBoundingBoxDescent || 0);
  const pad = 2 * S3, w = Math.ceil(m.width) + pad * 2, h = asc + desc + pad * 2;
  c.width = w; c.height = h;
  ctx.font = font; ctx.textBaseline = 'alphabetic';
  const g = ctx.createLinearGradient(0, 0, w, h * .35);
  g.addColorStop(0, '#B391E0'); g.addColorStop(1, '#4FA3E0');
  ctx.fillStyle = g; ctx.fillText(text, pad, pad + asc);
  return { b64: c.toDataURL('image/png').split(',')[1], width: Math.round(w / S3), height: Math.round(h / S3) };
}

function ensureSubmitted() {
  if (!CFG.apiUrl || (CFG.demo && !CFG.mailtest)) return Promise.resolve(null);
  const R = compute(); const key = snapshotKey(R);
  if (S.send && S.send.key === key && ['sent', 'saved'].includes(S.send.state) && S.recordId) return Promise.resolve(S.recordId);
  if (submitPromise && submitPromise.key === key) return submitPromise.p;
  setSend(key, 'sending');
  const p = (async () => {
    let pdf = null;
    try { pdf = (await buildPdf(R)).b64; } catch (e) { console.warn('[Snapshot] PDF se nepodařilo vytvořit, e-mail půjde bez přílohy:', e); }
    let indexImg = null;
    try { indexImg = await indexImage(R); } catch (e) { console.warn('[Snapshot] obrázek indexu se nepodařilo vytvořit:', e); }
    const snapshot = submitPayload(R);
    if (CFG.mailtest) { snapshot.email = CFG.email; snapshot.test = true; }
    const j = await api('submitSnapshot', { snapshot, email: emailData(R), pdf, indexImg }, 90000);
    S.recordId = j.id;
    setSend(key, j.emailed ? 'sent' : 'saved');
    return j.id;
  })().catch(e => { setSend(key, 'failed'); submitPromise = null; console.warn('[Snapshot] odeslání selhalo:', e.code || e.message); throw e; });
  submitPromise = { key, p };
  return p;
}

/* ---------- potvrzení zájmu + platba ---------- */
const CONFIRM_ERRORS = {
  rc_invalid: 'Rodné číslo nesouhlasí s datem narození. Zkontrolujte ho prosím.',
  rate_limited: 'Příliš mnoho pokusů. Zkuste to prosím za chvíli.',
  bad_phone: 'Telefon zadejte ve tvaru +420 777 123 456.'
};
document.addEventListener('click', async e => {
  const btn = e.target.closest('#ctaSubmit'); if (!btn || btn.disabled) return;
  const err = (m, f) => { $('#ctaErr').textContent = m; if (f) { const w = document.getElementById('w-' + f); if (w) w.classList.add('invalid'); } };
  err('');
  if (!S.a.surname || !S.a.surname.trim()) return err('Vyplňte prosím příjmení.', 'surname');
  const rcErr = validateRC(S.a.rc, S.a.dob); if (rcErr) return err(rcErr, 'rc');
  if (S.a.phone && !/^\+?[\d\s]{9,16}$/.test(S.a.phone.trim())) return err('Telefon zadejte ve tvaru +420 777 123 456.', 'phone');
  if (!S.a.ctaConsent) return err('Pro odeslání je potřeba souhlas.');
  if (!CFG.apiUrl) { S.cta.done = true; rerenderCTA(); if (CFG.kiosk) startThanksCountdown(); return; }
  btn.disabled = true; btn.textContent = 'Odesíláme…';
  try {
    const id = await ensureSubmitted();
    const j = await api('confirmInterest', { id, surname: S.a.surname.trim(), rc: S.a.rc, phone: (S.a.phone || '').trim(), consent: true }, 45000);
    S.payment = { vs: j.vs, amount: j.amount, due: j.due, account: j.account, iban: j.iban, spayd: j.spayd, festival: j.festival, emailed: j.emailed };
    delete S.a.rc;                                   // rodné číslo po odeslání v prohlížeči nedržíme
    S.cta.done = true; rerenderCTA();
    if (CFG.kiosk) startThanksCountdown();
  } catch (x) {
    btn.disabled = false; btn.textContent = 'Potvrdit zájem';
    err(CONFIRM_ERRORS[x.code] || 'Odeslání se nepovedlo. Zkuste to prosím znovu, nebo nám zavolejte na +420 775 481 700.', x.code === 'rc_invalid' ? 'rc' : null);
  }
});
async function showPaymentQr() {
  const box = $('#payQr'); if (!box || !S.payment) return;
  try {
    await lib('qr');
    const q = window.qrcode(0, 'M'); q.addData(S.payment.spayd); q.make();
    box.innerHTML = q.createImgTag(6, 2, 'QR platba');
  } catch (e) { box.textContent = 'QR kód najdete v e-mailu.'; box.style.cssText = 'font-size:13px;color:#19191B;line-height:1.4;padding:16px;max-width:160px'; }
}

function buildPayload(R) {
  const fest = festivalActive();
  return {
    src: CFG.src, kiosk: CFG.kiosk, startedAt: S.startedAt, finishedAt: new Date().toISOString(),
    firstName: S.a.firstName, surname: S.a.surname || '', dob: S.a.dob, rc: S.a.rc || '', email: S.a.email, phone: S.a.phone || '',
    consents: { gdpr: !!S.a.gdpr, marketing: !!S.a.marketing, interest: !!S.a.ctaConsent, version: '2026-09-v1' },
    age: R.age, height: num(S.a.height), weight: num(S.a.weight), waist: num(S.a.waist), bmi: R.bmi && +R.bmi.toFixed(1),
    measurements: Object.assign({}, S.m, { upload: undefined, reportWarn: undefined }), measSkipped: S.measSkipped,
    answers: Object.assign({}, S.a, { rc: undefined, surname: undefined, phone: undefined, email: undefined, firstName: undefined, dob: undefined }),
    scores: Object.fromEntries(ORDER.map(k => [k, R.detail[k].score])), index: R.index, confidence: R.confidence,
    priorities: R.priorities.map(p => p.k), signals: R.detail.hormonal.signals.map(s => ({ key: s.key, level: s.level })),
    flags: R.flags, contraindications: R.contra, internal: R.internal,
    interest: S.cta.open, price: fest ? CFG.priceFestival : CFG.priceRegular, festival: fest,
    report: { device: S.m.reportDevice || null, personName: S.m.reportName || null, measuredAt: S.m.reportDate || null, height: S.m.reportHeight || null, extra: S.m.reportExtra || null },
    aiTexts: aiTexts(R)
  };
}

/* ---------- reset & kiosk ---------- */
let idleTimer = null, idleCount = null, thanksTimer = null, overlayEl = null;
function resetAll() {
  clearInterval(genTimer); clearInterval(thanksTimer); clearTimeout(autoT); hideIdle();
  S = blank(); try { sessionStorage.removeItem(CFG.storageKey); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
function hideIdle() { clearInterval(idleCount); if (overlayEl) { overlayEl.remove(); overlayEl = null; } }
function armIdle() {
  if (!CFG.kiosk) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (S.cur === 'intro') { armIdle(); return; }
    let n = CFG.idleCountdown;
    overlayEl = document.createElement('div'); overlayEl.className = 'overlay';
    overlayEl.innerHTML = `<div class="box2"><span class="eyebrow">Jste tu ještě?</span><div class="count" id="idleN">${n}</div><p class="lead">Z bezpečnostních důvodů se vyplněné údaje za chvíli smažou.</p><button class="btn pri" type="button" id="idleStay">Pokračovat</button></div>`;
    document.body.appendChild(overlayEl);
    $('#idleStay').addEventListener('click', () => { hideIdle(); armIdle(); });
    idleCount = setInterval(() => { n--; const el = $('#idleN'); if (el) el.textContent = n; if (n <= 0) resetAll(); }, 1000);
  }, CFG.idleSeconds * 1000);
}
function startThanksCountdown() {
  let n = CFG.thanksResetSeconds; clearInterval(thanksTimer);
  thanksTimer = setInterval(() => { n--; const el = $('#kioskReset'); if (el) el.textContent = `Obrazovka se za ${n} s připraví pro další návštěvnici.`; if (n <= 0) resetAll(); }, 1000);
}
['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(ev => window.addEventListener(ev, () => { if (!overlayEl) armIdle(); }, { passive: true }));

if (CFG.demo) { fillDemo(); const t = document.createElement('div'); t.className = 'demo-tag'; t.textContent = 'Ukázková data'; document.body.appendChild(t); }
